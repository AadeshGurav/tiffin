name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The AppText classes are git-ignored — generate before analyze.
      - run: flutter gen-l10n

      - run: dart format --output=none --set-exit-if-changed lib test

      - run: dart analyze --fatal-infos

      - run: flutter test --exclude-tags tool

  rules-test:
    name: firestore.rules on the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: tool/rules-test
      - run: npm test
        working-directory: tool/rules-test

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: analyze-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tiffin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-14
    needs: analyze-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      # Compiles the whole iOS app + pods; skips signing (no certs in CI).
      - run: flutter build ios --release --no-codesign
