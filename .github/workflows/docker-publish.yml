name: Publish Docker image

# Runs after a merge to main, or on a version tag — not on every branch push
# or PR (that's what ci.yml's build-and-scan job is for).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-push

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image name
        id: image
        # GHCR requires a lowercase image path; github.repository preserves
        # the repo's actual casing (e.g. AadeshGurav/canteen-coupon-system).
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4 # enables the arm64 leg of the multi-arch build below
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for scanning (local only, amd64, not yet published)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: local-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gate as ci.yml — nothing reaches the registry until it's clean.
      - name: Scan before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local-scan:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
