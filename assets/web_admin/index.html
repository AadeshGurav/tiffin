<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiffin · Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Locale isn't known to the server (this is a static bundle — see
         app.js's i18n module doc comment), so the very first paint reads
         the device's own remembered choice directly rather than showing
         English then flashing to the right language a beat later. -->
    <div class="boot" id="boot">Loading…</div>
    <script>
      (function () {
        var boot = { en: 'Loading…', hi: 'लोड हो रहा है…', mr: 'लोड होत आहे…' };
        var locale = localStorage.getItem('tiffin_locale') || 'en';
        document.getElementById('boot').textContent = boot[locale] || boot.en;
      })();
    </script>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
