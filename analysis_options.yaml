include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore # riverpod_generator on constructors
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/**"
    - "test/generated_migrations/**" # drift schema snapshots, regenerated by `make schema`
    - "lib/data/local/schema_versions.dart" # ditto
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print # use core/logging.dart instead
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
