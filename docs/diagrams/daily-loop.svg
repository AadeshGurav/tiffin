<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="daily-loop-title daily-loop-desc" font-family="Geist, 'Helvetica Neue', Arial, sans-serif">
<title id="daily-loop-title">Prepaid units, served and restocked in a loop</title>
<desc id="daily-loop-desc">Members prepay units, units are spent at the counter, the menu plan sets headcount, headcount drives the shopping list, and costs are weighed against revenue.</desc>
<defs><marker id="daily-loop-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker><marker id="daily-loop-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bf4520"/></marker></defs>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="40" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#bf4520">HOW A CANTEEN DAY WORKS</text>
<text x="40" y="76" font-family="'Instrument Serif', Georgia, serif" font-size="30" fill="#2d3142">Prepaid units, served and restocked in a loop</text>
<path d="M320,168 L640,168" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#daily-loop-a)"/>
<path d="M760,208 L760,328" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#daily-loop-a)"/>
<path d="M640,368 L320,368" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#daily-loop-a)"/>
<path d="M200,328 L200,208" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#daily-loop-a)"/>
<rect x="80" y="128" width="240" height="80" fill="#f5f5f5"/>
<rect x="80" y="128" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="200" y="159" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2d3142">Top-up &amp; bill</text>
<text x="200" y="175" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#4f5d75">cash or UPI</text>
<text x="200" y="189" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#4f5d75">PDF bill</text>
<rect x="640" y="128" width="240" height="80" fill="#f5f5f5"/>
<rect x="640" y="128" width="240" height="80" rx="6" fill="#f5e3de" stroke="#bf4520" stroke-width="1.2"/>
<text x="760" y="159" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2d3142">Scan at counter</text>
<text x="760" y="175" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#4f5d75">−1 unit</text>
<text x="760" y="189" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#4f5d75">accept or reject</text>
<rect x="640" y="328" width="240" height="80" fill="#f5f5f5"/>
<rect x="640" y="328" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="760" y="359" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2d3142">Plan menu</text>
<text x="760" y="375" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#4f5d75">per meal · per category</text>
<text x="760" y="389" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#4f5d75">planned headcount</text>
<rect x="80" y="328" width="240" height="80" fill="#f5f5f5"/>
<rect x="80" y="328" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="200" y="359" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2d3142">Buy &amp; stock</text>
<text x="200" y="375" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#4f5d75">recipes → shopping list</text>
<text x="200" y="389" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#4f5d75">stock falls on each scan</text>
<rect x="458.5" y="145" width="43" height="15" fill="#f5f5f5"/><text x="480" y="156" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="9.5" letter-spacing=".8" fill="#5a6580">UNITS</text>
