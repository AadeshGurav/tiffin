<rect x="433.7" y="385" width="92.6" height="15" fill="#f5f5f5"/><text x="480" y="396" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="9.5" letter-spacing=".8" fill="#5a6580">SHOPPING LIST</text>
<rect x="206" y="261" width="49.2" height="15" fill="#f5f5f5"/><text x="212" y="272" text-anchor="start" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="9.5" letter-spacing=".8" fill="#5a6580">MARGIN</text>
<text x="480" y="262" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="20" fill="#4f5d75">Every step writes to</text><text x="480" y="288" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="20" fill="#4f5d75">one shared ledger.</text>
<circle r="4.5" fill="#bf4520" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M320,168 L640,168" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.2;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.2" values="0;1;0"/></circle>
<circle r="4.5" fill="#bf4520" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M760,208 L760,328" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.27;0.45;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.27;0.45" values="0;1;0"/></circle>
<circle r="4.5" fill="#bf4520" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M640,368 L320,368" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.52;0.7;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.52;0.7" values="0;1;0"/></circle>
<circle r="4.5" fill="#bf4520" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M200,328 L200,208" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.77;0.95;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.77;0.95" values="0;1;0"/></circle>
<line x1="40" x2="920" y1="476" y2="476" stroke="#bfc0c0"/>
<rect x="40" y="491" width="20" height="14" rx="3" fill="#f5e3de" stroke="#bf4520"/>
<text x="68" y="502" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#5a6580">Most frequent moment</text>
<rect x="220.0" y="491" width="20" height="14" rx="3" fill="#fff" stroke="#2d3142"/>
<text x="248.0" y="502" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#5a6580">Step</text>
<line x1="300.8" x2="328.8" y1="498" y2="498" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#daily-loop-a)"/>
<text x="336.8" y="502" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#5a6580">Hand-off</text>
<circle cx="420.4" cy="498" r="4.5" fill="#bf4520"/>
<text x="434.4" y="502" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#5a6580">A day, repeating</text>
</svg>
