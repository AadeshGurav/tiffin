<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="architecture-title architecture-desc" font-family="Geist, 'Helvetica Neue', Arial, sans-serif">
<title id="architecture-title">One app, one shared database, works offline</title>
<desc id="architecture-desc">Three phone roles write through a local cache and queue to a shared Cloud Firestore project, guarded by security rules and Firebase Auth.</desc>
